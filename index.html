    <meta charset="UTF-8" />
    <script>
      // Gracefully handle Vite HMR WebSocket in AI Studio cloud preview environment
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = typeof url === 'string' && (
              url.indexOf('token=') !== -1 ||
              (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1))
            );
            if (isViteHmr) {
              var listeners = {};
              return {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = '';
            if (arg) {
              if (typeof arg === 'string') text = arg;
              else if (arg.message) text = arg.message;
              else if (arg.stack) text = arg.stack;
              else text = String(arg);
            }
            if (text.indexOf('WebSocket closed without opened') !== -1 || text.indexOf('failed to connect to websocket') !== -1) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason.stack || String(e.reason)))) || '';
          if (typeof reason === 'string' && reason.indexOf('WebSocket closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
